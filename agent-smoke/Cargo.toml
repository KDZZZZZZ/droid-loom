[package]
name = "agent-smoke"
version = "0.1.0"
edition = "2024"

[lib]
name = "agent_smoke"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "agent-smoke-cli"
path = "src/main.rs"

[dependencies]
agent-core = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uniffi = "0.31.1"
