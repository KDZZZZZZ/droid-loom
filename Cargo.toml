[workspace]
members = [
    "agent-smoke",
    "crates/agent-core",
    "example/mobilerun-agent-boundary",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
agent-core = { path = "crates/agent-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
uuid = { version = "1", features = ["v4", "serde"] }
